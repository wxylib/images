name: publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: wxy
            context: cli
            rev_arg: CORE_REV
            test: --version
          - name: wxy-py
            context: py
            rev_arg: PY_REV
            test: python -c "import wxy; print(wxy.affine((0, 10, 0, 5), (10, 5)))"
          - name: wxy-r
            context: r
            rev_arg: R_REV
            test: Rscript -e "print(wxy::wxy_affine(c(0, 10, 0, 5), c(10, 5)))"
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Pinned source commit
        id: rev
        run: |
          rev=$(sed -n 's/^ARG ${{ matrix.rev_arg }}=//p' ${{ matrix.context }}/Dockerfile)
          echo "short=${rev:0:7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=src-${{ steps.rev.outputs.short }}
            type=sha,prefix=sha-

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          load: true
          tags: ${{ matrix.name }}:test
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Smoke test
        run: docker run --rm ${{ matrix.name }}:test ${{ matrix.test }}

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.name }}
